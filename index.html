<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuProfe20 Lab - Gráficos Estadísticos II</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- KaTeX para rendering matemático exacto -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100dvh; user-select: none; background: #1e1b4b; }
        .font-fun { font-family: 'Nunito', sans-serif; }
        
        @keyframes floatUp { 
            0% { transform: translateY(105vh) rotate(0deg); } 
            100% { transform: translateY(-105vh) rotate(360deg); } 
        }
        @keyframes slideInRight { 
            0% { opacity: 0; transform: translateX(12px); } 
            100% { opacity: 1; transform: translateX(0); } 
        }
        @keyframes confettiExplosion { 
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 
            80% { opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } 
        }
        @keyframes jellyPop {
            0% { transform: scale3d(.85, .85, .85); opacity: 0; }
            45% { transform: scale3d(1.04, 1.04, 1.04); opacity: 1; }
            75% { transform: scale3d(.98, .98, .98); }
            100% { transform: scale3d(1, 1, 1); opacity: 1; }
        }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes robotJump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-12px); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.25s ease-out forwards; }
        .animate-confettiExplosion { animation: confettiExplosion 1.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-jellyPop { animation: jellyPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-robotFloat { animation: robotFloat 2.8s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 0.9s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }

        /* KaTeX Grande y Nítido sin desbordes */
        .katex { font-weight: 900 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; overflow-x: auto; overflow-y: hidden; }
        
        .math-enunciado .katex { font-size: clamp(1rem, 2.6vw, 1.45rem) !important; color: #fde047 !important; }
        .math-current .katex { font-size: clamp(1.12rem, 3.6vw, 1.85rem) !important; color: #0f172a !important; line-height: 1.35 !important; }
        .math-final .katex { font-size: clamp(1.2rem, 3.8vw, 2rem) !important; color: #0f172a !important; line-height: 1.35 !important; }

        /* Etiquetas grandes de alto contraste para el gráfico SVG */
        .chart-label-title {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 15.5px;
            fill: #0f172a;
            stroke: #ffffff;
            stroke-width: 4.5px;
            paint-order: stroke fill;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }
        .chart-label-value {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 17px;
            fill: #0f172a;
            stroke: #ffffff;
            stroke-width: 5px;
            paint-order: stroke fill;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }
        .sector-group {
            cursor: pointer;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
        }
        .sector-group:hover {
            filter: brightness(1.07);
        }
        .sector-path {
            stroke: #ffffff;
            stroke-width: 3;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: paths}} />
        );

        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;

        // Controlador de Sonido y Voz
        const AudioController = {
            ctx: null, muted: false,
            init: function() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            play: function(type) {
                this.init();
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                
                if (type === 'pop') {
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
                    osc.start(now); osc.stop(now + 0.09);
                } else if (type === 'pop-reverse') {
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(650, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.11);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
                    osc.start(now); osc.stop(now + 0.11);
                } else if (type === 'slice') {
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(620, now); osc.frequency.exponentialRampToValueAtTime(1150, now + 0.07);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
                    osc.start(now); osc.stop(now + 0.07);
                } else if (type === 'success') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                        o.type = 'triangle'; o.frequency.value = freq;
                        o.connect(g); g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.07);
                        g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.22, startTime + 0.03); g.gain.linearRampToValueAtTime(0, startTime + 0.35);
                        o.start(startTime); o.stop(startTime + 0.35);
                    });
                } else if (type === 'swoosh') {
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(320, now); osc.frequency.exponentialRampToValueAtTime(90, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
                    osc.start(now); osc.stop(now + 0.16);
                }
            },
            speak: function(text) {
                if (this.muted || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-PE';
                utterance.rate = 1.05;
                utterance.pitch = 1.08;
                window.speechSynthesis.speak(utterance);
            },
            toggleMute: function() {
                this.muted = !this.muted;
                if (this.muted && 'speechSynthesis' in window) window.speechSynthesis.cancel();
                return this.muted;
            }
        };

        const STATISTICAL_EXERCISES = [
            {

                        robotSpeech: "El 120° pasa a restar quedando 240°. Luego dividimos 240° entre 16 y descubrimos que r vale 15°."
                    },
                    {
                        propertyText: "Paso 3: Ángulos y Diferencia (Básquet - Fútbol)",
                        sectorTexts: ['120°', '165°', '75°'],
                        latex: String.raw`\begin{aligned} \text{Básquet} &= 11(15^{\circ}) = 165^{\circ} \quad;\quad \text{Fútbol} = 5(15^{\circ}) = 75^{\circ} \\ \text{Diferencia} &= 165^{\circ} - 75^{\circ} = \textcolor{#7c3aed}{\mathbf{90^{\circ}}} \end{aligned}`,
                        robotSpeech: "Reemplazamos r = 15°: Básquet tiene 165° y Fútbol 75°. La diferencia entre ambos es de 90°."
                    },
                    {
                        propertyText: "Paso 4: Regla de Tres Simple en Aspa",
                        sectorTexts: ['120°', '165°', '75°'],
                        latex: String.raw`\begin{matrix} \textcolor{#1e40af}{\mathbf{360^{\circ}}} & \longleftrightarrow & \textcolor{#047857}{\mathbf{900\text{ jóv.}}} \\ \text{ } & \textcolor{#e11d48}{\huge\times} & \text{ } \\ \textcolor{#be185d}{\mathbf{90^{\circ}}} & \longleftrightarrow & \textcolor{#7c3aed}{\mathbf{x}} \end{matrix}`,
                        robotSpeech: "Planteamos la Regla de Tres: si 360° corresponden a 900 jóvenes, ¿cuántos jóvenes (x) serán los 90° de diferencia?"
                    },

                        propertyText: "Paso 5: Simplificación y Resultado",
                        sectorTexts: ['300 jóv.', 'Dif: 225', '187,5 jóv.'],
                        latex: String.raw`\begin{aligned} x &= \frac{\cancel{90}^{\textcolor{#e11d48}{1}} \cdot 900}{\cancel{360}_{\textcolor{#e11d48}{4}}} = \frac{900}{4} = \mathbf{225\text{ jóvenes}} \end{aligned}`,
                        robotSpeech: "Simplificamos sacando noventava arriba (1) y abajo (4). Finalmente dividimos 900 entre 4 y obtenemos 225 jóvenes."
                    }
                ]
            },
            {
                id: 2,
                title: "Reto 2",
                subtitle: "Áreas Académicas",
                cardBg: "from-[#4361ee] to-[#3a0ca3] border-[#4cc9f0]",
                enunciadoText: "El gráfico muestra las áreas preferidas por 240 postulantes. Calcula la suma de los que prefieren Ing. Química con Letras.",
                enunciadoLatex: String.raw`\text{Total} = 240`,
                baseSectors: [
                    { label: 'Medicina', value: 108, color: '#6366f1' },

                        robotSpeech: "Observa el cuadradito en el sector Derecho: ¡indica un ángulo recto de 90°! Sumamos todos los ángulos e igualamos a 360°."

                    {
                        propertyText: "Paso 2: Ángulo de Ing. Química + Letras",

                        latex: String.raw`\begin{aligned} 261^{\circ} + \alpha &= 360^{\circ} \implies \alpha = \mathbf{99^{\circ}} \\ \text{Quím. + Letras} &= 99^{\circ} + 63^{\circ} = \textcolor{#be185d}{\mathbf{162^{\circ}}} \end{aligned}`,
                        robotSpeech: "Hallamos que Ing. Química mide 99°. Al sumarlo con los 63° de Letras obtenemos 162° en conjunto."
                    },
                    {
                        propertyText: "Paso 3: Regla de Tres Simple en Aspa",
                        sectorTexts: ['108°', '63°', '99°', '90°'],
                        latex: String.raw`\begin{matrix} \textcolor{#1e40af}{\mathbf{360^{\circ}}} & \longleftrightarrow & \textcolor{#047857}{\mathbf{240\text{ post.}}} \\ \text{ } & \textcolor{#e11d48}{\huge\times} & \text{ } \\ \textcolor{#be185d}{\mathbf{162^{\circ}}} & \longleftrightarrow & \textcolor{#7c3aed}{\mathbf{x}} \end{matrix}`,
                        robotSpeech: "Planteamos la Regla de Tres: 360° representan a los 240 postulantes. ¿Cuántos postulantes (x) representan 162°?"
                    },
                    {
                        propertyText: "Paso 4: Simplificación y Resultado",
                        sectorTexts: ['72 post.', '42 post.', '66 post.', '60 post.'],
                        latex: String.raw`\begin{aligned} x &= \frac{162 \cdot \cancel{240}^{\textcolor{#e11d48}{2}}}{\cancel{360}_{\textcolor{#e11d48}{3}}} = \frac{\cancel{162}^{\textcolor{#0284c7}{54}} \cdot 2}{\cancel{3}_{\textcolor{#0284c7}{1}}} = \mathbf{108\text{ postulantes}} \end{aligned}`,
                        robotSpeech: "Simplificamos 240 y 360 sacando 120ava (2 y 3). Luego 162 entre 3 nos da 54, y por 2 resulta 108 postulantes."
                    }
                ]
            },
            {
                id: 3,
                title: "Reto 3",
                subtitle: "Cursos Escolares",
                cardBg: "from-[#06d6a0] to-[#118ab2] border-[#80ffdb]",
                enunciadoText: "Se representa la preferencia de 720 estudiantes por 5 cursos. ¿Cuántos más prefieren Matemática que Ciencia y Ambiente?",
                enunciadoLatex: String.raw`\text{Total} = 720`,
                baseSectors: [
                    { label: 'Matemática', value: 108, color: '#8b5cf6' },
                    { label: 'P. Social', value: 118, color: '#f59e0b' },
                    { label: 'C. y Amb.', value: 36, color: '#10b981' },
                    { label: 'Arte', value: 28, color: '#ec4899' },
                    { label: 'Lenguaje', value: 70, color: '#3b82f6' }
                ],
                steps: [
                    {
                        propertyText: "Paso 1: Suma de sectores = 360°",
                        sectorTexts: ['6θ', '118°', '2θ', '28°', '70°'],
                        latex: String.raw`\begin{aligned} 6\theta + 2\theta + 118^{\circ} + 28^{\circ} + 70^{\circ} &= 360^{\circ} \\ 8\theta + 216^{\circ} &= 360^{\circ} \end{aligned}`,
                        robotSpeech: "En el gráfico Matemática es 6θ y Ciencia y Ambiente es 2θ. Sumamos todos los ángulos e igualamos a 360°."

                        robotSpeech: "Despejamos θ = 18°. Así Matemática mide 108° y C. y Ambiente 36°. Su diferencia es 4θ = 72°."
                    },
                    {
                        propertyText: "Paso 3: Regla de Tres Simple en Aspa",
                        sectorTexts: ['108°', '118°', '36°', '28°', '70°'],
                        latex: String.raw`\begin{matrix} \textcolor{#1e40af}{\mathbf{360^{\circ}}} & \longleftrightarrow & \textcolor{#047857}{\mathbf{720\text{ est.}}} \\ \text{ } & \textcolor{#e11d48}{\huge\times} & \text{ } \\ \textcolor{#be185d}{\mathbf{72^{\circ}}} & \longleftrightarrow & \textcolor{#7c3aed}{\mathbf{x}} \end{matrix}`,
                        robotSpeech: "Planteamos la Regla de Tres Simple: si 360° corresponden a 720 estudiantes, ¿a cuántos estudiantes (x) corresponden 72°?"
                    },
                    {
                        propertyText: "Paso 4: Simplificación y Resultado",
                        sectorTexts: ['216 est.', '236 est.', '72 est.', '56 est.', '140 est.'],
                        latex: String.raw`\begin{aligned} x &= \frac{72 \cdot \cancel{720}^{\textcolor{#e11d48}{2}}}{\cancel{360}_{\textcolor{#e11d48}{1}}} = 72 \cdot 2 = \mathbf{144\text{ estudiantes}} \end{aligned}`,
                        robotSpeech: "¡Simplificamos 720 entre 360 y nos queda 2! Multiplicamos 72 por 2 y obtenemos 144 estudiantes de diferencia."

            {

                title: "Reto 4",
                subtitle: "Medios de Transporte",
                cardBg: "from-[#f72585] to-[#b5179e] border-[#ff70a6]",
                enunciadoText: "Los sectores Tren Eléctrico y Bicicleta están en relación de 3 a 2. Calcula el ángulo central (θ) de Bicicleta.",

                ],
                steps: [
                    {
                        propertyText: "Paso 1: Ángulo Recto = 25% del total",

                        robotSpeech: "El cuadradito en Auto nos dice que mide 90°, que equivale al 25% del círculo. Sumamos todo e igualamos al 100%."

                    },
                    {
                        propertyText: "Paso 3: Regla de Tres Simple en Aspa",
                        sectorTexts: ['35%', '16% = θ', '24%', '25%'],
                        latex: String.raw`\begin{matrix} \textcolor{#1e40af}{\mathbf{100\%}} & \longleftrightarrow & \textcolor{#047857}{\mathbf{360^{\circ}}} \\ \text{ } & \textcolor{#e11d48}{\huge\times} & \text{ } \\ \textcolor{#be185d}{\mathbf{16\%}} & \longleftrightarrow & \textcolor{#7c3aed}{\mathbf{\theta}} \end{matrix}`,
                        robotSpeech: "Convertimos porcentaje a grados con Regla de Tres: si el 100% son 360°, ¿cuántos grados (θ) serán el 16%?"
                    },
                    {

                        sectorTexts: ['126°', '57,6°', '86,4°', '90°'],

                        robotSpeech: "Cancelamos un cero, sacamos mitad (8 y 5) y dividimos 288 entre 5. ¡El ángulo central de Bicicleta es 57,6°!"
                    }
                ]
            },
            {
                id: 5,
                title: "Reto 5",
                subtitle: "Campaña Veterinaria",

        const MathDisplay = memo(({ latex, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(latex, containerRef.current, {
                            displayMode: true, throwOnError: false, strict: false, trust: true
                        });
                    } catch (e) {
                        containerRef.current.innerText = latex;
                    }
                }
            }, [latex]);

            return (
                <div className={`relative w-full flex justify-center items-center overflow-x-auto scrollbar-hide ${className}`}>
                    <div ref={containerRef} className="w-full text-center py-1" />
                </div>
            );
        });

        // Gráfico Circular Grande y Claro
        const PieChart = memo(({ baseSectors, sectorTexts, selectedSector, onSelectSector }) => {
            const size = 300;
            const radius = 136; // Ocupa casi todo el viewBox sin cortarse al explotar una tajada
            const center = size / 2;
            const total = baseSectors.reduce((sum, item) => sum + item.value, 0);
            let currentAngle = -Math.PI / 2;

            return (
                <div className="relative w-full h-full flex items-center justify-center">
                    <svg 
                        viewBox={`0 0 ${size} ${size}`} 
                        className="w-full h-full max-w-[230px] sm:max-w-[310px] md:max-w-[370px] max-h-full aspect-square drop-shadow-[0_10px_20px_rgba(0,0,0,0.18)] overflow-visible"
                    >
                        {baseSectors.map((slice, index) => {
                            const angle = (slice.value / total) * Math.PI * 2;
                            const isRightAngle = slice.isRightAngle && Math.abs(angle - Math.PI / 2) < 0.08;
                            const x1 = center + radius * Math.cos(currentAngle);
                            const y1 = center + radius * Math.sin(currentAngle);
                            const x2 = center + radius * Math.cos(currentAngle + angle);
                            const y2 = center + radius * Math.sin(currentAngle + angle);
                            const largeArc = angle > Math.PI ? 1 : 0;

                            const d = `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;

                            const midAngle = currentAngle + angle / 2;
                            const labelRadius = angle < 0.65 ? radius * 0.73 : radius * 0.60;
                            const tx = center + labelRadius * Math.cos(midAngle);
                            const ty = center + labelRadius * Math.sin(midAngle);

                            const isSelected = selectedSector === index;
                            const offsetDist = isSelected ? 12 : 0;
                            const ox = offsetDist * Math.cos(midAngle);
                            const oy = offsetDist * Math.sin(midAngle);

                            let rightAnglePath = null;
                            if (isRightAngle) {
                                const sq = 20;
                                const rx1 = center + sq * Math.cos(currentAngle);
                                const ry1 = center + sq * Math.sin(currentAngle);
                                const rx2 = center + sq * Math.cos(currentAngle) + sq * Math.cos(currentAngle + angle);
                                const ry2 = center + sq * Math.sin(currentAngle) + sq * Math.sin(currentAngle + angle);
                                const rx3 = center + sq * Math.cos(currentAngle + angle);
                                const ry3 = center + sq * Math.sin(currentAngle + angle);
                                rightAnglePath = `M ${rx1} ${ry1} L ${rx2} ${ry2} L ${rx3} ${ry3}`;
                            }

                            currentAngle += angle;
                            const dynamicText = sectorTexts && sectorTexts[index] !== undefined ? sectorTexts[index] : '';

                            return (
                                <g 
                                    key={index} 
                                    className="sector-group"
                                    style={{ transform: `translate(${ox}px, ${oy}px)` }}
                                    onClick={() => onSelectSector(index)}
                                >
                                    <path 
                                        d={d} 
                                        fill={slice.color} 
                                        className="sector-path" 
                                        style={{ strokeWidth: isSelected ? 4.5 : 3, stroke: isSelected ? '#0f172a' : '#ffffff' }}
                                    />
                                    {rightAnglePath && (
                                        <path d={rightAnglePath} fill="rgba(255,255,255,0.7)" stroke="#0f172a" strokeWidth="2.5" strokeLinejoin="miter" />
                                    )}
                                    <text x={tx} y={dynamicText ? ty - 9 : ty} className="chart-label-title">
                                        {slice.label}
                                    </text>
                                    {dynamicText && (
                                        <text x={tx} y={ty + 11} className="chart-label-value">
                                            {dynamicText}
                                        </text>
                                    )}
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        });

        const FloatingBackground = memo(() => {
            const symbols = ['+', '-', '×', '÷', '=', '✨', '360°', 'θ', '%', '📊'];
            const elements = Array.from({ length: 18 }).map((_, i) => ({
                id: i, symbol: symbols[i % symbols.length], left: `${(i * 6) % 96}%`,
                animationDuration: `${12 + (i % 8) * 2}s`, animationDelay: `-${(i * 1.3)}s`,
                fontSize: `${1.2 + (i % 3) * 0.7}rem`, opacity: 0.12

            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    {elements.map((el) => (
                        <div key={el.id} className="absolute text-white font-black animate-floatUp select-none" style={{ left: el.left, bottom: '-15%', fontSize: el.fontSize, opacity: el.opacity, animationDuration: el.animationDuration, animationDelay: el.animationDelay }}>
                            {el.symbol}
                        </div>
                    ))}
                </div>
            );
        });

            const pieces = Array.from({ length: 80 }).map((_, i) => ({
                id: i, left: `${50 + (Math.random() * 20 - 10)}%`, color: colors[i % colors.length],
                tx: `${(Math.random() - 0.5) * 650}px`, ty: `${(Math.random() - 1) * 650}px`, rot: `${Math.random() * 720}deg`, delay: `${Math.random() * 0.15}s`
            }));
            return (
                <div className="absolute inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden">
                    {pieces.map((p) => (
                        <div key={p.id} className="absolute w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full animate-confettiExplosion" style={{ backgroundColor: p.color, '--tx': p.tx, '--ty': p.ty, '--rot': p.rot, animationDelay: p.delay, left: p.left, top: '50%' }} />
                    ))}
                </div>

        });

        const RobotAssistant = ({ step, maxSteps, onSpeak }) => {
            const isFinalStep = step >= maxSteps;
            return (
                <button 
                    onClick={onSpeak}
                    title="Toca para escuchar al robot"
                    className={`relative flex flex-col items-center select-none cursor-pointer group active:scale-90 transition-transform shrink-0 ${isFinalStep ? 'animate-robotJump' : 'animate-robotFloat'}`}
                >
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-3 h-3 rounded-full shadow-[0_0_8px_currentColor] z-10 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-3 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-12 h-12 sm:w-16 sm:h-16 bg-gradient-to-br from-white to-slate-200 rounded-2xl border-[3px] border-indigo-400 shadow-md flex flex-col items-center justify-center p-1 group-hover:border-pink-500 transition-colors">
                        <div className="w-full h-full bg-slate-900 rounded-xl flex flex-col items-center justify-center p-1 border border-indigo-500">
                            {isFinalStep ? (
                                <div className="w-full flex justify-between px-1.5"><div className="w-3 h-1.5 bg-emerald-400 rounded-t-full"></div><div className="w-3 h-1.5 bg-emerald-400 rounded-t-full"></div></div>
                            ) : (
                                <div className="w-full flex justify-between px-1.5"><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div></div>
                            )}
                            <div className={`w-4 sm:w-5 h-2 bg-rose-400 rounded-full mt-1.5 ${step > 0 && !isFinalStep ? 'animate-ping' : ''}`}></div>
                        </div>
                    </div>
                </button>
            );
        };

        function App() {
            const [view, setView] = useState('home');
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [isMuted, setIsMuted] = useState(false);
            const [selectedSector, setSelectedSector] = useState(null);

            const currentExercise = STATISTICAL_EXERCISES[exIdx];
            const maxSteps = currentExercise.steps.length - 1;
            const currentStepData = currentExercise.steps[step];
            const totalValue = currentExercise.baseSectors.reduce((s, item) => s + item.value, 0);

            const startExercise = (index) => {
                AudioController.play('swoosh');
                setExIdx(index);
                setStep(0);
                setSelectedSector(null);
                setView('lab');
            };

            const handleSelectSector = (index) => {
                AudioController.play('slice');
                setSelectedSector(prev => prev === index ? null : index);
            };

            const nextStep = () => {
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next);
                    if (next === maxSteps) AudioController.play('success');
                    else AudioController.play('pop');
                } else {
                    if (exIdx < STATISTICAL_EXERCISES.length - 1) {
                        AudioController.play('swoosh');
                        setExIdx(exIdx + 1);
                        setStep(0);
                        setSelectedSector(null);
                    } else {
                        AudioController.play('swoosh');
                        setView('home');
                    }
                }
            };

            const prevStep = () => {
                if (step > 0) {
                    setStep(step - 1);
                    AudioController.play('pop-reverse');
                }
            };

            const toggleMute = () => {
                setIsMuted(AudioController.toggleMute());
            };

            // PORTADA (Retos 1 al 10)
            if (view === 'home') {
                return (
                    <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#312e81] via-[#6d28d9] to-[#be185d] flex flex-col items-center justify-start p-3 sm:p-6 relative font-fun overflow-y-auto overflow-x-hidden scrollbar-hide">
                        <FloatingBackground />
                        
                        <div className="w-full max-w-6xl z-20 flex items-center justify-between mb-4 sm:mb-8 mt-1 shrink-0">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-yellow-300 bg-white/15 backdrop-blur-md text-yellow-300 font-black tracking-wider uppercase shadow-md text-sm sm:text-lg">
                                <Rocket className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>
                            <button onClick={toggleMute} className="p-2.5 sm:p-3 rounded-2xl bg-white/20 border-2 border-white/30 backdrop-blur-md text-white hover:bg-white/30 transition-all active:scale-95">
                                {isMuted ? <VolumeX className="w-6 h-6" /> : <Volume2 className="w-6 h-6" />}
                            </button>
                        </div>

                        <div className="relative z-10 text-center w-full max-w-6xl flex flex-col items-center">
                            <h1 className="text-3xl sm:text-5xl md:text-6xl font-black text-white mb-2 drop-shadow-[0_4px_0_rgba(0,0,0,0.3)] tracking-tight leading-tight uppercase">
                                Gráficos Estadísticos <span className="text-yellow-300 underline decoration-wavy decoration-pink-400">II</span>
                            </h1>
                            <p className="text-sm sm:text-xl text-purple-100 mb-6 sm:mb-8 font-bold max-w-3xl px-2">
                                ¡Domina el análisis de sectores circulares, regla de tres y ángulos paso a paso! 📊✨
                            </p>

                            <div className="w-full grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-4 pb-8">
                                {STATISTICAL_EXERCISES.map((ex, idx) => (
                                    <button
                                        key={ex.id}
                                        onClick={() => startExercise(idx)}
                                        className={`group text-left p-3.5 sm:p-4 rounded-2xl sm:rounded-[1.5rem] bg-gradient-to-br ${ex.cardBg} border-[3px] hover:-translate-y-1.5 active:scale-95 transition-all flex flex-col justify-between relative overflow-hidden shadow-lg min-h-[7.8rem] sm:min-h-[9rem]`}
                                    >
                                        <div className="flex items-center justify-between w-full">
                                            <span className="bg-black/30 text-white text-xs sm:text-sm font-black px-2.5 py-0.5 rounded-lg uppercase tracking-wider">
                                                {ex.title}
                                            </span>
                                            <span className="text-white/90 text-xs sm:text-sm font-black">#{ex.id}</span>
                                        </div>
                                        <div className="my-2 text-white font-black text-sm sm:text-lg leading-snug drop-shadow">
                                            {ex.subtitle}
                                        </div>
                                        <div className="flex items-center justify-between pt-2 border-t border-white/25 w-full">
                                            <span className="text-xs text-white font-extrabold">Ver análisis</span>
                                            <span className="bg-yellow-400 text-slate-900 w-6 h-6 rounded-full flex items-center justify-center font-black group-hover:translate-x-1 transition-transform text-xs shadow">
                                                ➔
                                            </span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            const activeSlice = selectedSector !== null ? currentExercise.baseSectors[selectedSector] : null;
            const activeDeg = activeSlice ? Math.round((activeSlice.value / totalValue) * 360 * 10) / 10 : 0;
            const activePct = activeSlice ? Math.round((activeSlice.value / totalValue) * 100 * 10) / 10 : 0;

            return (
                <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#1e1b4b] via-[#4c1d95] to-[#be185d] text-slate-800 flex flex-col p-1 sm:p-2.5 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {step === maxSteps && <Confetti />}

                    {/* Barra Superior */}
                    <div className="shrink-0 relative z-10 w-full max-w-7xl mx-auto flex justify-between items-center mb-1 sm:mb-2 px-1 gap-2">
                        <button onClick={() => { AudioController.play('swoosh'); setView('home'); }} className="flex items-center justify-center px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-white/15 border-2 border-white/30 backdrop-blur-md text-white font-black hover:bg-white/25 transition-all active:scale-95 text-xs sm:text-base shrink-0">
                            <Home className="w-4 h-4 sm:w-5 sm:h-5 sm:mr-1.5" />
                            <span className="hidden sm:inline">Portada</span>
                        </button>

                        <div className="flex items-center gap-1 sm:gap-1.5 bg-black/35 p-1 rounded-xl border border-white/20 backdrop-blur-md overflow-x-auto max-w-[72vw] scrollbar-hide">
                            {STATISTICAL_EXERCISES.map((ex, i) => (
                                <button
                                    key={ex.id}
                                    onClick={() => startExercise(i)}
                                    className={`w-7 h-7 sm:w-9 sm:h-9 rounded-lg font-black text-xs sm:text-base transition-all shrink-0 ${exIdx === i ? 'bg-yellow-400 text-slate-900 scale-105 shadow-[0_0_12px_rgba(250,204,21,0.8)]' : 'text-white/85 hover:bg-white/20'}`}
                                >
                                    {ex.id}
                                </button>
                            ))}
                        </div>

                        <button onClick={toggleMute} className="p-1.5 sm:p-2 rounded-xl bg-white/15 border-2 border-white/30 text-white hover:bg-white/25 transition-all active:scale-95 shrink-0">
                            {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                        </button>
                    </div>

                    {/* Pizarra Principal de Alto Aprovechamiento */}
                    <div className="flex-1 min-h-0 relative z-10 w-full max-w-7xl mx-auto bg-white rounded-2xl sm:rounded-[1.8rem] border-4 sm:border-[6px] border-slate-100 shadow-2xl flex flex-col overflow-hidden">
                        
                        {/* Enunciado Grande y Destacado */}
                        <div className="shrink-0 bg-slate-900 border-b-4 border-indigo-500 px-3 py-2 sm:px-6 sm:py-3 flex flex-col md:flex-row items-center justify-between gap-1.5 sm:gap-4">
                            <div className="flex items-center gap-2 shrink-0">
                                <span className="bg-yellow-400 text-slate-900 font-black text-xs sm:text-sm px-2.5 py-0.5 rounded-md uppercase tracking-wider">
                                    {currentExercise.title}
                                </span>
                                <span className="text-purple-200 font-extrabold text-xs sm:text-sm bg-white/10 px-2.5 py-0.5 rounded-md">
                                    {currentExercise.subtitle}
                                </span>
                            </div>
                            <p className="text-white font-black text-xs sm:text-base md:text-lg text-center md:text-left leading-snug flex-1">
                                {currentExercise.enunciadoText}
                            </p>
                            <div className="math-enunciado shrink-0 bg-black/40 px-3 py-1 rounded-xl border border-white/25">
                                <MathDisplay latex={currentExercise.enunciadoLatex} />
                            </div>
                        </div>

                        {/* Zona Central: Gráfico Grande (Izquierda/Arriba) y Desarrollo Continuo Grande (Derecha/Abajo) */}
                        <div className="flex-1 min-h-0 w-full flex flex-col md:flex-row items-stretch justify-between p-2 sm:p-4 gap-2 sm:gap-4 relative bg-slate-50 overflow-hidden">
                            
                            {/* Panel del Gráfico Circular (46% en PC, 46% alto en móvil) */}
                            <div className="w-full md:w-[46%] h-[46%] md:h-full flex flex-col items-center justify-between z-10 shrink-0 bg-white rounded-2xl border-2 border-slate-200 p-2 sm:p-4 shadow-sm">
                                <div className="flex-1 min-h-0 w-full flex items-center justify-center">
                                    <PieChart 
                                        baseSectors={currentExercise.baseSectors} 
                                        sectorTexts={currentStepData.sectorTexts}
                                        selectedSector={selectedSector}
                                        onSelectSector={handleSelectSector}
                                    />
                                </div>

                                {/* Barra inferior interactiva del gráfico */}
                                <div className="shrink-0 w-full pt-1 flex flex-wrap items-center justify-center gap-1.5">
                                    {activeSlice ? (
                                        <div 
                                            onClick={() => setSelectedSector(null)}
                                            className="animate-jellyPop cursor-pointer flex items-center gap-2 px-3 py-1 rounded-xl bg-slate-900 text-white text-xs sm:text-sm font-black shadow-md"
                                        >
                                            <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: activeSlice.color }}></span>
                                            <span>{activeSlice.label}:</span>
                                            <span className="text-yellow-300">{activeDeg}°</span>
                                            <span className="text-cyan-300">({activePct}%)</span>
                                            <span className="text-white/60 text-[10px] ml-1">✕</span>
                                        </div>
                                    ) : (
                                        currentExercise.baseSectors.map((s, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleSelectSector(idx)}
                                                className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-indigo-50 text-slate-800 text-xs sm:text-sm font-extrabold border border-slate-300 transition-all active:scale-95"
                                            >
                                                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: s.color }}></span>
                                                {s.label}
                                            </button>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Panel de Desarrollo Matemático Grande (54% en PC, 54% alto en móvil) */}
                            <div className="w-full md:w-[54%] h-[54%] md:h-full flex flex-col items-center justify-center z-10 bg-white rounded-2xl border-2 border-slate-200 p-2.5 sm:p-5 shadow-sm overflow-y-auto scrollbar-hide">
                                
                                {/* Título del Paso */}
                                <div key={`badge-${exIdx}-${step}`} className="mb-2 sm:mb-4 animate-jellyPop text-center shrink-0">
                                    <span className={`inline-flex items-center gap-2 px-4 py-1.5 sm:px-5 sm:py-2 rounded-xl font-black text-xs sm:text-lg shadow-sm border-2 ${step === maxSteps ? 'bg-amber-400 text-slate-900 border-yellow-500' : 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white border-indigo-400'}`}>
                                        <Sparkles className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" /> 
                                        <span>{currentStepData.propertyText}</span>
                                    </span>
                                </div>

                                {/* Ecuación Principal Grande */}
                                <div key={`current-${exIdx}-${step}`} className="w-full flex-1 flex items-center justify-center animate-jellyPop">
                                    <div className={`transition-all px-3 py-3 sm:px-6 sm:py-6 w-full text-center rounded-2xl flex items-center justify-center ${step === maxSteps ? 'bg-[#fde047] border-4 sm:border-[5px] border-[#eab308] shadow-[0_10px_30px_rgba(234,179,8,0.35)] math-final' : 'bg-slate-50/80 border-2 border-slate-200/80 math-current'}`}>
                                        <MathDisplay latex={currentStepData.latex} />
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Panel del Robot Asistente con Texto Grande */}
                        <div className="shrink-0 bg-white w-full px-3 py-2 sm:px-6 sm:py-3 flex items-center gap-3 sm:gap-5 border-t-2 border-slate-100 z-10">
                            <RobotAssistant 
                                step={step} 
                                maxSteps={maxSteps} 
                                onSpeak={() => AudioController.speak(currentStepData.robotSpeech)}
                            />
                            <div className="flex-1 text-xs sm:text-base md:text-lg font-extrabold text-slate-800 leading-snug bg-indigo-50/90 px-3.5 py-2 sm:px-5 sm:py-3 rounded-2xl border-2 border-indigo-100 flex items-center justify-between gap-3">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight flex-1">
                                    {currentStepData.robotSpeech}
                                </div>
                                <button 
                                    onClick={() => AudioController.speak(currentStepData.robotSpeech)}
                                    title="Escuchar explicación"
                                    className="shrink-0 px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs sm:text-sm font-black hover:bg-indigo-700 active:scale-95 transition-all shadow-sm"
                                >
                                    🔊 Voz
                                </button>
                            </div>
                        </div>

                        {/* Botones de Navegación Inferiores */}
                        <div className="shrink-0 bg-gradient-to-b from-[#eadef7] to-[#d6c1f0] p-2 sm:p-3 w-full flex flex-col items-center border-t-2 border-white z-10">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-2.5 sm:gap-4 h-11 sm:h-13">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#d8b4fe] border-b-4 border-[#a855f7] text-[#581c87] rounded-xl font-black text-sm sm:text-lg flex items-center justify-center gap-1 active:border-b-0 active:translate-y-1 disabled:opacity-40 transition-all hover:bg-[#e9d5ff]"
                                >
                                    <ChevronLeft className="w-5 h-5 sm:w-6 sm:h-6 stroke-[3.5px]" />
                                    <span>Atrás</span>
                                </button>

                                <div className="bg-[#9333ea] text-white font-black px-4 sm:px-6 text-sm sm:text-lg flex items-center justify-center rounded-xl border-b-4 border-[#6b21a8] shadow-inner whitespace-nowrap">
                                    Paso {step + 1}/{maxSteps + 1}
                                </div>

                                <button
                                    onClick={nextStep}
                                    className={`flex-[1.8] border-b-4 text-white rounded-xl font-black text-sm sm:text-xl flex items-center justify-center gap-2 active:border-b-0 active:translate-y-1 transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#f59e0b] to-[#ea580c] border-[#c2410c]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? '¡Siguiente Paso!'
                                            : exIdx < STATISTICAL_EXERCISES.length - 1
                                            ? `Ir al Reto ${exIdx + 2}`
                                            : '¡Volver a la Portada!'}
                                    </span>
                                    <ChevronRight className="w-5 h-5 sm:w-6 sm:h-6 stroke-[3.5px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
